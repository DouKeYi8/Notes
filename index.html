<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0, user-scalable=yes">
  <title>生產管理概論</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: auto; /* 允許手機自由滑動 */
      background-color: #ffffff;
      -webkit-overflow-scrolling: touch;
    }
    .wrapper {
      display: inline-block;
      min-width: 100%;
      padding: 10px;
    }
    img {
      display: block;
      /* 讓超大心智圖有足夠實體空間展開，不再擠壓 */
      min-width: 1400px;
      height: auto;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <img src="CH1_SVG.svg" alt="生產管理概論心智圖">
  </div>

</body>
</html>
