<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=8.0, user-scalable=yes">
  <title>生產管理概論</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      overflow: auto; /* 允許手機上下左右全向滑動 */
      -webkit-overflow-scrolling: touch;
    }
    .svg-wrapper {
      display: inline-block;
      min-width: 100%;
      padding: 20px;
    }
    object {
      display: block;
      width: auto;
      height: auto;
      min-width: 1400px; /* 保證心智圖在手機上有足夠寬度完全展開 */
    }
  </style>
</head>
<body>

  <div class="svg-wrapper">
    <!-- 這裡換成你的新檔名 -->
    <object id="mindmap-svg" data="CH1_SVG.svg" type="image/svg+xml"></object>
  </div>

  <script>
    // 徹底消除 SVG 內部 KaTeX 的雙重殘影與破音字重疊
    const obj = document.getElementById('mindmap-svg');
    obj.addEventListener('load', () => {
      try {
        const svgDoc = obj.contentDocument;
        if (svgDoc) {
          const style = svgDoc.createElementNS("http://www.w3.org/2000/svg", "style");
          style.textContent = `
            .katex-mathml { display: none !important; }
            .visually-hidden { display: none !important; }
            annotation { display: none !important; }
          `;
          svgDoc.documentElement.appendChild(style);
        }
      } catch (e) {
        console.error("樣式注入受阻", e);
      }
    });
  </script>

</body>
</html>
